name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_check:
        description: Run the optional Germany live diagnostic against Apple
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check apple_store_mcp tests
      - name: Test
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Build package
        run: uv build
      - name: Check launcher
        run: uv run --frozen python -m apple_store_mcp --config

  live-check:
    if: github.event_name == 'workflow_dispatch' && inputs.live_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen python -m apple_store_mcp --check de
